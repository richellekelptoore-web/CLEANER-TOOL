[General]
app_name = Memory Clearer
version = 2.0
author = Memory Clearer Team

[UI]
window_width = 800
window_height = 600
theme = default

[Cleanup]
auto_cleanup_interval = 300
cache_cleanup_enabled = true
logs_cleanup_enabled = true
temp_cleanup_enabled = true

[Monitoring]
monitor_enabled = true
alert_threshold_mb = 500
check_interval = 30

[Logging]
log_enabled = true
log_level = INFO
log_path = clear/logs
max_log_files = 10

[Backup]
backup_enabled = true
backup_path = clear/backups
